server:
  port: 8080
  servlet:
    context-path: /cms
spring:
  application:
    name: SmashHub
  config:
    import:
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/badminton_shop}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
     ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      enabled: true
      # Giới hạn kích thước 1 file upload (phải khớp với MAX_FILE_SIZE trong FileServiceImpl = 5 MB).
      max-file-size: 5MB
      # Giới hạn toàn bộ request multipart (dư chút cho metadata form).
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:${SPRING_MAIL_USERNAME:thanhlongbc28@gmail.com}}
    password: ${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:root}

jwt:
  signerKey: ${JWT_SIGNER_KEY:default_secret_signer_key_must_be_overridden_in_env_file_123456}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}

app:
  otp:
    expiration-minutes: 5
    resend-cooldown-seconds: 60
  login:
    max-failed-attempts: 5
    failure-window-minutes: 15
    lockout-minutes: 15

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  # Thư mục gốc trên Cloudinary. Các sub-folder (products/, brands/, reviews/)
  # được ghép tự động bởi FileFolder.resolve(rootFolder).
  folder: ${CLOUDINARY_FOLDER:smashhub}