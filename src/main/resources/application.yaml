server:
  port: 8080
  servlet:
    context-path: /cms
spring:
  application:
    name: SmashHub
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/badminton_shop}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:thanhlongbc28@gmail.com}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:root}

jwt:
  signerKey: ${JWT_SIGNER_KEY:default_secret_signer_key_must_be_overridden_in_env_file_123456}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}

app:
  otp:
    expiration-minutes: 5
    resend-cooldown-seconds: 60
  login:
    max-failed-attempts: 5
    failure-window-minutes: 15
    lockout-minutes: 15